[project]
name = "chess-puzzles"
version = "0.1.0"
description = "Epoch AI's Chess Puzzles benchmark, as an Inspect task"
requires-python = ">=3.13,<3.14"
dependencies = [
    "inspect-ai==0.3.273",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
